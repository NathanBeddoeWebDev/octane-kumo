<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octane Kumo table and pagination</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../src/styles/kumo-standalone.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--color-kumo-recessed);
      }
      main {
        display: grid;
        gap: 24px;
      }
      section {
        padding: 24px;
        border-radius: 12px;
        background: var(--color-kumo-base);
        color: var(--text-color-kumo-default);
      }
      h1,
      h2 {
        font-weight: 600;
        margin: 0 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 16px;
      }
      .examples {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      .example {
        min-width: 0;
      }
      .extras {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        margin-top: 24px;
      }
      @media (max-width: 900px) {
        .examples,
        .extras {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./table-pagination-preview.tsx"></script>
  </body>
</html>
