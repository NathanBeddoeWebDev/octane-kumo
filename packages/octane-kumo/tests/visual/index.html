<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octane Kumo component preview</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../src/styles/kumo-standalone.css" />
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--color-kumo-recessed);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .preview {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .shell-main {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        gap: 20px;
        padding: 32px;
      }

      .shell-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .shell-header h1 {
        margin: 0;
      }

      .shell-banner {
        max-width: 960px;
      }

      .mode {
        min-height: 400px;
        padding: 28px;
        border-radius: 16px;
        background: var(--color-kumo-base);
        color: var(--text-color-kumo-default);
      }

      .mode h2 {
        margin: 0 0 24px;
        font-size: 20px;
      }

      .mode h3 {
        margin: 28px 0 16px;
        font-size: 16px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .form-grid input,
      .form-grid textarea {
        box-sizing: border-box;
        width: 100%;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 20px;
        margin: 20px 0;
      }

      .control-columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin: 20px 0;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin: 20px 0;
      }

      .status-stack {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .skeleton-card,
      .composed-collapsible {
        box-sizing: border-box;
        padding: 16px;
        border: 1px solid var(--color-kumo-fill);
        border-radius: 12px;
        background: var(--color-kumo-control);
      }

      .skeleton-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .composed-trigger {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text-color-kumo-default);
        font: inherit;
        font-weight: 600;
      }

      .composed-panel {
        margin-top: 12px;
        color: var(--text-color-kumo-subtle);
      }

      .empty-grid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
        gap: 20px;
        align-items: stretch;
      }

      .empty-grid > * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./button-preview.tsx"></script>
  </body>
</html>
