<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octane Kumo Button preview</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../src/styles/kumo-standalone.css" />
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--color-kumo-recessed);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .preview {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        padding: 32px;
      }

      .mode {
        min-height: 400px;
        padding: 28px;
        border-radius: 16px;
        background: var(--color-kumo-base);
        color: var(--text-color-kumo-default);
      }

      .mode h2 {
        margin: 0 0 24px;
        font-size: 20px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./button-preview.tsx"></script>
  </body>
</html>
